<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mongle</title>
  <link rel="icon" href="/logo.png">
  <style>
    /* Аппын харанхуй палитраас ШУУД (lib/theme/tokens/color_primitives.dart,
       share-preview worker-тэй ижил): canvas i950 · raised i900 ·
       contentPrimary i100 · contentSecondary i400 · borderSubtle i775 ·
       аксент МОНОХРОМ — inverseSurface n100 / onInverseSurface n1000 */
    :root{--bg:#0B1014;--card:#14191D;--fg:#E4E9ED;--muted:#99A7B5;--inv:#E7E9EF;--on-inv:#07080B;--line:#28333D}
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
         /* Цэнхэр туяа ХАСав — брэнд монохром (хар дэвсгэр дээр цагаан тэмдэг)
            болсон тул өнгөт гэрэл нь логотой зөрчилддөг. Аппын canvas шиг цул. */
         background:var(--bg);
         color:var(--fg);display:flex;min-height:100vh;margin:0;align-items:center;
         justify-content:center;padding:24px}
    .card{width:100%;max-width:360px;text-align:center}
    .logo{width:96px;height:96px;border-radius:24px;object-fit:cover;
          /* Логоны сүүдэр ч цэнхэр байв — тэмдэг өөрөө хар хайрцагтай тул
             зөвхөн гүнийг өгөх саарал сүүдэр үлдээв. */
          box-shadow:0 12px 44px rgba(0,0,0,.55);margin-bottom:18px}
    /* Доод зай нь урьд `.tag` мөрөнд байсныг ӨВЛӨВ: тайлбар хасагдсанаар
       гарчиг товчнуудад наалдаж, карт дээд талаараа шахагдаж байв. */
    h1{font-size:26px;margin:0 0 20px;letter-spacing:.2px}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;
         padding:15px;border-radius:14px;background:var(--inv);color:var(--on-inv);text-decoration:none;
         font-weight:600;font-size:15px;border:none;width:100%}
    .btn:active{opacity:.85}
    .btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
    .foot{color:var(--muted);font-size:12px;margin-top:26px}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mongle">
    <h1>Mongle</h1>
    <a class="btn" href="https://github.com/mongle-app/mongle/releases/latest/download/mongle.apk">Android татах (APK)</a>
    <a class="btn ghost" href="https://testflight.apple.com/join/Wuwp1Aqr">iOS татах (TestFlight)</a>
    <p class="foot">© Mongle</p>
  </div>
</body>
</html>
