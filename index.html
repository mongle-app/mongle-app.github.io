<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mongle</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root{--bg:#070A11;--card:#0E131C;--fg:#E8ECF3;--muted:#9AA3B2;--primary:#2F6BFF;--line:#1E2632}
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
         background:#12203f;
         color:var(--fg);display:flex;min-height:100vh;margin:0;align-items:center;
         justify-content:center;padding:24px}
    .card{width:100%;max-width:360px;text-align:center}
    .logo{width:96px;height:96px;border-radius:24px;object-fit:cover;margin-bottom:18px}
    h1{font-size:26px;margin:0 0 6px;letter-spacing:.2px}
    .tag{color:var(--muted);font-size:15px;margin:0 0 28px}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;
         padding:15px;border-radius:14px;background:var(--primary);color:#fff;text-decoration:none;
         font-weight:600;font-size:15px;border:none;width:100%}
    .btn:active{opacity:.85}
    .btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
    .foot{color:var(--muted);font-size:12px;margin-top:26px}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mongle">
    <h1>Mongle</h1>
    <p class="tag">Монголчуудын шинэ сошиал</p>
    <a class="btn" href="https://github.com/mongle-app/mongle/releases/latest/download/mongle.apk">Android татах (APK)</a>
    <span class="btn ghost" style="opacity:.5">iOS (удахгүй)</span>
    <p class="foot">© Mongle</p>
  </div>
</body>
</html>
