<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mongle</title>
  <link rel="icon" href="/logo.png">
  <style>
    :root{--bg:#070A11;--card:#0E131C;--fg:#E8ECF3;--muted:#9AA3B2;--primary:#2F6BFF;--line:#1E2632}
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
         background:#12203f;
         color:var(--fg);display:flex;min-height:100vh;margin:0;align-items:center;
         justify-content:center;padding:24px}
    .card{width:100%;max-width:360px;text-align:center}
    .logo{width:88px;height:88px;border-radius:12px;object-fit:cover;margin-bottom:18px}
    h1{font-size:22px;margin:0 0 6px;letter-spacing:.2px}
    .who{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 26px}
    .u{color:var(--primary);font-weight:700}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;
         padding:15px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;
         font-weight:600;font-size:15px;border:none;width:100%;cursor:pointer;font-family:inherit}
    .btn:active{opacity:.85}
    .btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
    .sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:22px 0 8px}
    .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
    .foot{color:var(--muted);font-size:12px;margin-top:26px}
    .hint{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:14px 16px;font-size:13px;line-height:1.6;color:var(--fg);margin:2px 0 10px;text-align:left}
    .hint b{color:var(--primary)}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mongle">
    <h1>Mongle</h1>
    <p class="who" id="who">Профайлыг аппликейшнээр үзнэ үү.</p>
    <button class="btn" id="open">Аппаар нээх</button>
    <div class="hint" id="hint" hidden>
      ⚠️ Энэ нь <b>Messenger доторх browser</b> тул апп нээгдэхгүй.
      Баруун дээд <b>⋮</b> цэс → <b>"Chrome-оор нээх"</b> сонгоод дахин орж
      "Аппаар нээх" дарна уу.
    </div>
    <div class="sep">эсвэл апп татах</div>
    <a class="btn ghost" href="https://github.com/mongle-app/mongle/releases/latest/download/mongle.apk">Android (APK)</a>
    <span class="btn ghost" style="opacity:.5">iOS (удахгүй)</span>
  </div>
  <script>
    var m = location.pathname.match(/^\/u\/([^\/?#]+)/);
    var username = m && m[1] ? decodeURIComponent(m[1]) : null;
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    // In-app browser (Messenger/FB/Instagram/Line г.м.) — App Links ажилладаггүй,
    // intent:// блоклогддог тул "Аппаар нээх" оронд заавар харуулна.
    var isInApp = /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|MicroMessenger|Twitter/i.test(ua);

    if (username) {
      document.getElementById('who').innerHTML =
        '<span class="u">@' + username + '</span> профайлыг аппликейшнээр үзнэ үү.';
    }

    if (isInApp) {
      document.getElementById('open').style.display = 'none';
      document.getElementById('hint').hidden = false;
    }

    document.getElementById('open').addEventListener('click', function () {
      if (!username) { location.href = '/'; return; }
      var u = encodeURIComponent(username);
      if (isAndroid) {
        // v1.0.5-ийн App Links intent-filter-ыг package-аар шууд онилж нээнэ
        // (browser доторх ижил-домэйн хязгаарлалтыг тойроно).
        location.href = 'intent://mongle-app.github.io/u/' + u +
          '#Intent;scheme=https;package=mn.bilguun.mongle;end';
      } else if (isIOS) {
        // Custom scheme — v1.0.6-д бүртгэгдэнэ (одоохондоо ажиллахгүй байж болно).
        location.href = 'mongle://u/' + u;
      }
    });
  </script>
</body>
</html>
