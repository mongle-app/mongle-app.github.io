<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mongle</title>
  <link rel="icon" href="/logo.png">
  <style>
    /* Аппын палитраас ШУУД (lib/theme/tokens): canvas n950 · raised n900 ·
       contentPrimary n100 · contentSecondary n450 · accentSolid b500 · n800 */
    :root{--bg:#0C1014;--card:#16181D;--fg:#E7E9EF;--muted:#8B92A2;--primary:#3563DC;--line:#2A2D36}
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
         background:var(--bg);
         color:var(--fg);display:flex;min-height:100vh;margin:0;align-items:center;
         justify-content:center;padding:24px}
    .card{width:100%;max-width:360px;text-align:center}
    .logo{width:88px;height:88px;border-radius:12px;object-fit:cover;
          box-shadow:0 12px 44px rgba(0,0,0,.55);margin-bottom:18px}
    h1{font-size:22px;margin:0 0 6px;letter-spacing:.2px}
    .who{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 26px}
    .u{color:var(--primary);font-weight:700}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;
         padding:15px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;
         font-weight:600;font-size:15px;border:none;width:100%;cursor:pointer;font-family:inherit;
         -webkit-tap-highlight-color:transparent}
    .btn:active{opacity:.85}
    .btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
    .sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:22px 0 8px}
    .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
    .foot{color:var(--muted);font-size:12px;margin-top:26px}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Mongle">
    <h1>Mongle</h1>
    <p class="who" id="who">Профайлыг аппликейшнээр үзнэ үү.</p>
    <button class="btn" id="open">Аппаар нээх</button>
    <div class="sep">эсвэл апп татах</div>
    <a class="btn ghost" href="https://github.com/mongle-app/mongle/releases/latest/download/mongle.apk">Android (APK)</a>
    <a class="btn ghost" href="https://testflight.apple.com/join/Wuwp1Aqr">iOS (TestFlight)</a>
  </div>
  <script>
    // /u/<username> · /p/<postId> · /v/<videoId> (пост·бичлэг — v1.3.13+).
    var m = location.pathname.match(/^\/([upv])\/([^\/?#]+)/);
    var kind = m ? m[1] : null;
    var id = m && m[2] ? decodeURIComponent(m[2]) : null;
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);

    var who = document.getElementById('who');
    if (kind === 'u' && id) {
      // textContent — URL-ээс ирсэн утгыг HTML болгож оруулахгүй.
      var span = document.createElement('span');
      span.className = 'u';
      span.textContent = '@' + id;
      who.textContent = '';
      who.appendChild(span);
      who.appendChild(document.createTextNode(' профайлыг аппликейшнээр үзнэ үү.'));
    } else if (kind === 'p' && id) {
      who.textContent = 'Энэ постыг аппликейшнээр үзнэ үү.';
    } else if (kind === 'v' && id) {
      who.textContent = 'Энэ бичлэгийг аппликейшнээр үзнэ үү.';
    }

    document.getElementById('open').addEventListener('click', function () {
      if (!id) { location.href = '/'; return; }
      var path = '/' + kind + '/' + encodeURIComponent(id);
      if (isAndroid) {
        // App Links intent-filter-ыг package-аар шууд онилж нээнэ
        // (browser доторх ижил-домэйн хязгаарлалтыг тойроно).
        location.href = 'intent://mongle-app.github.io' + path +
          '#Intent;scheme=https;package=mn.bilguun.mongle;end';
      } else if (isIOS) {
        // Custom scheme — одоохондоо бүртгэгдээгүй (ажиллахгүй байж болно).
        location.href = 'mongle:/' + path;
      }
    });
  </script>
</body>
</html>
